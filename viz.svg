<text x="232.5" y="133.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">ways(n) → ways(n-1) + ways(n-2)</text>
<rect x="391.0" y="114.0" width="261.0" height="28.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="521.5" y="133.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">base → ways(0)=1, ways(1)=1</text>
