<text x="56.0" y="285.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">ways(5) = 8. The naive recursion recomputes subtrees exponentially; two variables</text>
<text x="56.0" y="304.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">make it O(n). This recurrence-with-small-state shape is the template for the harder</text>
<text x="56.0" y="323.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">DPs ahead.</text>
